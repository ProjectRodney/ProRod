<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- ANZIAK app icon, original drawing (DZOFT, 7 November 2026). Full-bleed square: the phone rounds the corners.
       The bubble stays inside the central 80 % circle so the "maskable" crop never cuts it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE600"/>
      <stop offset="0.42" stop-color="#FFEE2E"/>
      <stop offset="0.78" stop-color="#FFF8C4"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <path id="bubble" d="M 467.9 678 L 330 770 L 346.2 611.8 A 240 205 0 1 1 467.9 678 Z"/>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g stroke-linejoin="round" stroke-linecap="round">
    <use href="#bubble" fill="#fff" stroke="#fff" stroke-width="96"/>
    <use href="#bubble" transform="translate(16 22)" fill="#fff" stroke="#fff" stroke-width="96"/>
    <use href="#bubble" transform="translate(16 22)" fill="#111" stroke="#111" stroke-width="30"/>
    <use href="#bubble" fill="#fff" stroke="#111" stroke-width="30"/>
  </g>
  <g fill="#111">
    <circle cx="420" cy="482" r="36"/>
    <circle cx="530" cy="482" r="36"/>
    <circle cx="640" cy="482" r="36"/>
  </g>
</svg>
