name: Deploy to GitHub Pages
# Builds, tests and publishes dist/ to https://upzoneapp.fr/ (GitHub Pages, custom domain) on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # to see when the uploaded site is listed (step below)
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # The publishing step asks GitHub for the site uploaded just above. GitHub sometimes takes a moment to list it, and the
      # step then fails with « No artifacts named github-pages were found » (seen five times in four days, November 2026).
      # A failed run cannot simply be re-run either: the second upload makes two sites with the same name. So wait here
      # until the upload is listed, for one minute at most.
      - name: Wait until GitHub lists the uploaded site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name=="github-pages")] | length' 2>/dev/null || echo 0)
            if [ "$n" = "1" ]; then echo "Listed after $(( (i-1)*2 )) s."; exit 0; fi
            sleep 2
          done
          echo "Still not listed after 60 s; trying to publish anyway."
      # Being listed is not enough (25 Nov 2026: listed at once, and the publishing step still found nothing, twice in a
      # row): the publishing step reads another index. So it is tried up to three times, twenty seconds apart. A failed
      # try stops before anything is published, and the site is uploaded only once, so trying again is safe.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before a second try
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before a third try
        if: steps.deployment2.outcome == 'failure'
        run: sleep 20
      - id: deployment3
        if: steps.deployment2.outcome == 'failure'
        uses: actions/deploy-pages@v4
